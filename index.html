<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      src: local("Inter");
    }

    :root {
      --bg:      #f5f5f7;
      --ink:     #1d1d1f;
      --muted:   #6e6e73;
      --faint:   #c7c7cc;
      --accent:  #0066cc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      font-family: "Inter", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      background: var(--bg);
      overflow: hidden;
    }

    /* =============================================
       SCENE 1 — Typewriter + scrolling keyword ticker
       (0–4s)
       "Bring AI to next " stays fixed; "level" is
       replaced by a vertical ticker of AI keywords
       that scrolls upward, the centered word in black
       and the others faded by distance.
       ============================================= */
    #scene1 { position: absolute; inset: 0; }
    #scene1-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #type-line {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }

    #type-text {
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1.1;
      white-space: nowrap;
    }

    #cursor {
      display: inline-block;
      width: 3px;
      height: 60px;
      background: var(--accent);
      margin-left: 6px;
      vertical-align: bottom;
      opacity: 1;
    }

    /* Ticker — sits right after the fixed phrase, replaces "level" */
    #ticker-wrap {
      display: inline-flex;
      align-items: baseline;
      margin-left: 18px;
      opacity: 0;
    }

    /* The masked window — shows ~3 keyword slots tall */
    #ticker {
      position: relative;
      width: 460px;
      height: 240px;          /* 3 slots × 80px */
      overflow: hidden;
      /* vertical fade mask so top/bottom keywords dissolve */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 30%, #000 70%, transparent 100%);
    }

    #ticker-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .kw-item {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      color: var(--faint);
    }

    /* =============================================
       SCENE 2 — Signature (4–6s)
       ============================================= */
    #scene2 { position: absolute; inset: 0; }
    #scene2-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0;
    }

    .sig-mask {
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #sig-name {
      font-family: "Inter", sans-serif;
      font-size: 48px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.03em;
      text-align: center;
      white-space: nowrap;
    }

    #sig-title {
      font-family: "Inter", sans-serif;
      font-size: 26px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div data-hf-id="hf-ph1f" id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1080">

    <!-- SCENE 1: Typewriter + keyword ticker (0–4s) -->
    <div data-hf-id="hf-67e6" id="scene1" class="clip" data-start="0" data-duration="4" data-track-index="1" data-layout-allow-overlap="true">
      <div data-hf-id="hf-knmf" id="scene1-inner">
        <div data-hf-id="hf-9jes" id="type-line">
          <span data-hf-id="hf-0neq" id="type-text"></span><span data-hf-id="hf-42e8" id="cursor"></span>
          <span data-hf-id="hf-w7si" id="ticker-wrap" data-layout-allow-overflow="true">
            <span data-hf-id="hf-ayox" id="ticker" data-layout-allow-overflow="true">
              <span data-hf-id="hf-pgsv" id="ticker-inner">
                <span data-hf-id="hf-vipr" class="kw-item">Analysis</span>
                <span data-hf-id="hf-vaag" class="kw-item">Code</span>
                <span data-hf-id="hf-6aji" class="kw-item">Docs</span>
                <span data-hf-id="hf-ccc4" class="kw-item">Fixing</span>
                <span data-hf-id="hf-b8hu" class="kw-item">SEO</span>
                <span data-hf-id="hf-2hvs" class="kw-item">Research</span>
                <span data-hf-id="hf-gfbn" class="kw-item">Writing</span>
                <span data-hf-id="hf-3q0v" class="kw-item">Analysis</span>
                <span data-hf-id="hf-gncg" class="kw-item">Code</span>
                <span data-hf-id="hf-2a4i" class="kw-item">Docs</span>
              </span>
            </span>
          </span>
        </div>
      </div>
    </div>

    <!-- SCENE 2: Signature (4–6s) -->
    <div data-hf-id="hf-z1je" id="scene2" class="clip" data-start="4" data-duration="2" data-track-index="2">
      <div data-hf-id="hf-hzkg" id="scene2-inner">
        <div data-hf-id="hf-mqrh" class="sig-mask" data-layout-allow-overflow="true"><div data-hf-id="hf-0h0z" id="sig-name">Ludovic Figueiredo</div></div>
        <div data-hf-id="hf-dfyp" class="sig-mask" data-layout-allow-overflow="true"><div data-hf-id="hf-5kxk" id="sig-title">Tech &amp; AI Addict</div></div>
      </div>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* -----------------------------------------------
       SCENE 1 — Typewriter then keyword ticker
       Phase A (0–1.5s): type "Bring AI to next level"
       Phase B (~1.5s):  swap "level" → scrolling ticker
       Phase C (1.5–3.6s): ticker scrolls upward, the
         centered keyword is black, neighbors faded by
         distance. Mask dissolves top/bottom.
       ----------------------------------------------- */
    const PHRASE_FIXED = "Bring AI to next ";  /* stays */
    const WORD_LEVEL   = "level";              /* typed then replaced */
    const FULL_TEXT    = PHRASE_FIXED + WORD_LEVEL;
    const TYPE_START   = 0.25;
    const TYPE_DUR     = 1.1;

    const typeEl   = document.getElementById("type-text");
    const cursorEl = document.getElementById("cursor");

    /* Phase A — typewriter types the whole phrase incl. "level" */
    const driver = { v: 0 };
    tl.to(driver, {
      v: FULL_TEXT.length,
      duration: TYPE_DUR,
      ease: "none",
      onUpdate() {
        typeEl.textContent = FULL_TEXT.slice(0, Math.round(driver.v));
      }
    }, TYPE_START);

    /* Cursor blink while typing (sin driver, deterministic) */
    const blinkDriver = { p: 0 };
    tl.to(blinkDriver, {
      p: Math.PI * 2 * 3,
      duration: 1.5,
      ease: "none",
      onUpdate() {
        cursorEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
      }
    }, 0);

    /* Phase B — at 1.5s, strip "level" from the typed text, hide
       cursor, and reveal the ticker in its place. */
    tl.call(() => {
      typeEl.textContent = PHRASE_FIXED;
    }, [], 1.5);
    tl.set("#cursor", { opacity: 0, display: "none" }, 1.5);
    tl.to("#ticker-wrap", { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.5);

    /* Phase C — scroll the ticker upward.
       ITEM_H = 80px. The window is 240px (3 slots); the centered
       slot is the 2nd visible one (offset 80px from top).
       We scroll through 6 keywords over the dwell, landing each
       on the center line with a soft settle, then continuous. */
    const ITEM_H = 80;
    const innerEl = document.getElementById("ticker-inner");

    /* Position so the FIRST keyword sits on the center line:
       center line is at y=120 (middle of 240px window).
       Item center for index i is at i*80 + 40. To place index 0
       at 120, translate by 120 - 40 = +80... but we translate the
       inner UP (negative). Start with index 0 centered: shift so
       item0 center aligns to window center. */
    const CENTER_OFFSET = 120 - ITEM_H / 2; /* 80px: item0 centered */

    /* scrollPos counts keywords advanced (0 = "Analysis" centered) */
    const scroll = { pos: 0 };
    function applyTicker() {
      const y = CENTER_OFFSET - scroll.pos * ITEM_H;
      innerEl.style.transform = `translateY(${y}px)`;

      /* color each item by distance from the centered slot */
      const items = innerEl.children;
      for (let i = 0; i < items.length; i++) {
        const dist = Math.abs(i - scroll.pos);
        let color;
        if (dist < 0.4)      color = "#1d1d1f";  /* centered — black */
        else if (dist < 1.2) color = "#9a9aa0";  /* adjacent — grey */
        else                 color = "#c7c7cc";  /* far — faint */
        items[i].style.color = color;
      }
    }
    applyTicker();

    /* Roll from index 0 → 6 across the dwell (1.6s → 3.6s).
       power1.inOut over the whole run gives a smooth, continuous
       scroll with gentle ease at start/end (like the reference). */
    tl.to(scroll, {
      pos: 6,
      duration: 2.0,
      ease: "power1.inOut",
      onUpdate: applyTicker
    }, 1.6);

    /* Fade scene 1 out before signature */
    tl.to("#scene1-inner", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.7);
    tl.set("#scene1-inner", { opacity: 0 }, 4.0);

    /* -----------------------------------------------
       SCENE 2 — Signature mask-reveal
       ----------------------------------------------- */
    tl.set("#scene2-inner", { opacity: 1 }, 4.0);

    tl.fromTo("#sig-name",  { y: 60 }, { y: 0, duration: 0.42, ease: "power3.out" }, 4.2);
    tl.fromTo("#sig-title", { y: 38 }, { y: 0, duration: 0.38, ease: "power3.out" }, 4.55);

    tl.to("#scene2-inner", { opacity: 0, duration: 0.35, ease: "power1.in" }, 5.55);

    /* Hard kills */
    tl.set("#scene2-inner", { opacity: 0 }, 6.0);
    tl.set("#sig-name",  { y: 60 }, 6.0);
    tl.set("#sig-title", { y: 38 }, 6.0);

    window.__timelines["main"] = tl;
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      src: local("Inter");
    }

    :root {
      --ink: #1d1d1f;
      --accent: #e85102;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #eef4fb;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    /* Iridescent background layers */
    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
    }

    #bg-dots {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
    }

    /* Scene */
    #scene1 {
      position: absolute;
      inset: 0;
    }

    #scene1-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #type-line {
      display: flex;
      align-items: baseline;
      justify-content: center;
      /* During initial phrase reveal, this keeps content centered.
         Once ticker-wrap appears, x translation shifts the whole line left
         so the phrase+ticker block ends up centered as a unit. */
      will-change: transform;
    }

    #phrase-box {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    #type-text {
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1.1;
      white-space: nowrap;
    }

    #cursor {
      display: inline-block;
      width: 3px;
      height: 60px;
      background: var(--accent);
      margin-left: 6px;
      align-self: flex-end;
      flex: 0 0 auto;
      opacity: 1;
      margin-bottom: 4px;
    }

    #ticker-wrap {
      position: absolute;
      display: inline-block;
      width: 340px;
      height: 80px;
      left: calc(100% + 16px);
      top: 0;
      /* hidden until the phrase slides left to make room */
      opacity: 0;
    }

    #ticker {
      position: absolute;
      left: 0;
      top: -90px;
      width: 100%;
      height: 240px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 66%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 66%, transparent 100%);
    }

    #ticker-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .kw-item {
      height: 80px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      color: #f7bfa0;
      /* glass-engraved texture: light highlight top, shadow bottom, inner depth */
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.60),
        0 -1px 0 rgba(180, 70, 0, 0.18),
        0 2px 6px rgba(232, 81, 2, 0.12),
        0 0 24px rgba(232, 81, 2, 0.08);
      -webkit-text-stroke: 0.3px rgba(200, 65, 0, 0.20);
    }
  </style>
</head>

<body>
  <div data-hf-id="hf-ph1f" id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080"
    data-height="1080">

    <!-- Iridescent background canvas -->
    <canvas data-hf-id="hf-eo1d" id="bg-canvas" width="1080" height="1080"></canvas>

    <!-- Dot-grid overlay — animated ripple canvas -->
    <canvas data-hf-id="hf-lhbl" id="bg-dots" width="1080" height="1080"></canvas>

    <!-- SCENE 1: Typewriter + keyword ticker (0–6s) -->
    <div data-hf-id="hf-67e6" id="scene1" class="clip" data-start="0" data-duration="6" data-track-index="0"
      data-layout-allow-overlap="true">
      <div data-hf-id="hf-knmf" id="scene1-inner">
        <div data-hf-id="hf-9jes" id="type-line">
          <span data-hf-id="hf-49nd" id="phrase-box"><span data-hf-id="hf-0neq" id="type-text"></span><span
              data-hf-id="hf-42e8" id="cursor"></span><span data-hf-id="hf-w7si" id="ticker-wrap"
              data-layout-allow-overflow="true">
              <span data-hf-id="hf-ayox" id="ticker" data-layout-allow-overflow="true">
                <span data-hf-id="hf-pgsv" id="ticker-inner">
                  <span data-hf-id="hf-lvl0" id="kw-level" class="kw-item"><span data-hf-id="hf-kyjs"
                      id="level-text"></span></span>
                  <span data-hf-id="hf-vipr" class="kw-item">DESIGN</span>
                  <span data-hf-id="hf-vaag" class="kw-item">PRODUCT</span>
                  <span data-hf-id="hf-6aji" class="kw-item">SUPPORT</span>
                  <span data-hf-id="hf-ccc4" class="kw-item">TEAM</span>
                  <span data-hf-id="hf-b8hu" class="kw-item">DATA</span>
                  <span data-hf-id="hf-lvl1" class="kw-item">FINANCE</span>
                </span>
              </span>
            </span>
          </span>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* -----------------------------------------------
       IRIDESCENT BACKGROUND
       Canvas 2D — deterministic, driven by GSAP time.
       Large elliptical blobs whose position AND hue
       shift slowly — aurora-style movement like the
       iris.mp4 reference, but in very light pastels
       on a near-white base.
    ----------------------------------------------- */
    const bgCanvas = document.getElementById("bg-canvas");
    const ctx = bgCanvas.getContext("2d");
    const W = 1080, H = 1080;

    /* HSL helper — keeps saturation/lightness fixed, only hue shifts */
    function hsl(h, s, l, a) {
      return `hsla(${h % 360},${s}%,${l}%,${a})`;
    }

    /* Draw one elliptical blob using a scaled radial gradient.
       rx/ry are radii in pixels, angle rotates the ellipse. */
    function drawBlob(cx, cy, rx, ry, angle, colorInner, colorOuter) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.scale(rx / ry, 1);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, ry);
      grad.addColorStop(0, colorInner);
      grad.addColorStop(0.5, colorInner.replace(/[\d.]+\)$/, "0.3)"));
      grad.addColorStop(1, colorOuter);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, ry, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function renderBg(t) {
      ctx.clearRect(0, 0, W, H);

      /* Base: white */
      ctx.fillStyle = "#f5f5f7";
      ctx.fillRect(0, 0, W, H);

      const TAU = Math.PI * 2;

      /* Black blobs — very low opacity so they stay subtle */
      const blobs = [
        /* [bx, by, ax, ay, fx, fy, rx, ry, ang_base, ang_amp, ang_freq, alpha] */
        [0.15, 0.20, 0.25, 0.20, 0.31, 0.27, 680, 420, 0.4, 0.3, 0.19, 0.07],
        [0.80, 0.75, 0.15, 0.18, 0.41, 0.37, 620, 380, -0.5, 0.4, 0.23, 0.06],
        [0.50, 0.55, 0.35, 0.15, 0.22, 0.48, 550, 340, 0.2, 0.5, 0.16, 0.05],
        [0.88, 0.12, 0.10, 0.14, 0.34, 0.29, 480, 300, 0.8, 0.3, 0.21, 0.05],
      ];

      for (const [bx, by, ax, ay, fx, fy, rx, ry, ab, aa, af, alpha] of blobs) {
        const cx = W * (bx + ax * Math.sin(t * TAU * fx));
        const cy = H * (by + ay * Math.cos(t * TAU * fy));
        const ang = ab + aa * Math.sin(t * TAU * af);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ang);
        ctx.scale(rx / ry, 1);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, ry);
        grad.addColorStop(0, `rgba(0,0,0,${alpha})`);
        grad.addColorStop(0.5, `rgba(0,0,0,${alpha * 0.4})`);
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, ry, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    /* Initial paint */
    renderBg(0);

    /* -----------------------------------------------
       DOT RIPPLE
       Grid of dots 12px apart. Each dot's opacity is
       driven by a radial sine wave emanating from the
       center, repeating every ~1.4s. Multiple rings
       travel outward simultaneously (phase offsets).
       Base dot color slightly darker than background
       so it stays readable but never distracting.
    ----------------------------------------------- */
    const dotCanvas = document.getElementById("bg-dots");
    const dctx = dotCanvas.getContext("2d");
    const GRID = 12;   /* spacing between dots */
    const DOT_R = 1.0;  /* dot radius px */
    const COLS = Math.ceil(W / GRID);
    const ROWS = Math.ceil(H / GRID);
    const CX = W / 2;
    const CY = H / 2;
    /* Max distance from center to corner */
    const MAX_D = Math.sqrt(CX * CX + CY * CY);

    /* Wave params */
    const WAVE_SPEED = 220;   /* px per second the ring travels */
    const WAVE_WIDTH = 160;   /* px — width of one sine lobe */
    const WAVE_INTERVAL = 1.4;   /* seconds between successive rings */
    const NUM_RINGS = 4;     /* concurrent rings */
    const BASE_ALPHA = 0.10;  /* resting dot opacity */
    const PEAK_ALPHA = 0.28;  /* dot opacity at wave crest */

    function renderDots(tSec) {
      dctx.clearRect(0, 0, W, H);

      for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {
          const x = col * GRID + GRID / 2;
          const y = row * GRID + GRID / 2;
          const dist = Math.sqrt((x - CX) * (x - CX) + (y - CY) * (y - CY));

          /* Sum contributions from all concurrent rings */
          let wave = 0;
          for (let k = 0; k < NUM_RINGS; k++) {
            const ringT = tSec - k * WAVE_INTERVAL;
            const front = ringT * WAVE_SPEED;          /* leading edge px */
            const delta = dist - front;                 /* signed dist to front */
            if (delta > -WAVE_WIDTH && delta < 0) {
              /* inside the ring — sine envelope, 0 at edges, 1 at center */
              const phase = (delta / WAVE_WIDTH) * Math.PI;   /* -π to 0 */
              wave += Math.sin(phase) * Math.sin(phase);       /* sin² ≥ 0 */
            }
          }
          wave = Math.min(wave, 1);

          const alpha = BASE_ALPHA + (PEAK_ALPHA - BASE_ALPHA) * wave;
          dctx.beginPath();
          dctx.arc(x, y, DOT_R, 0, Math.PI * 2);
          /* orange tint: #e85102 = rgb(232,81,2) */
          dctx.fillStyle = `rgba(232,81,2,${alpha.toFixed(3)})`;
          dctx.fill();
        }
      }
    }

    renderDots(0);

    /* -----------------------------------------------
       MAIN TIMELINE
    ----------------------------------------------- */
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* Drive both layers from timeline time */
    const bgDriver = { t: 0 };
    tl.to(bgDriver, {
      t: 1,
      duration: 6,
      ease: "none",
      onUpdate() {
        const tSec = bgDriver.t * 6;
        renderBg(bgDriver.t);
        renderDots(tSec);
      }
    }, 0);

    const PHRASE_FIXED = "Your AI for";
    const WORD_LEVEL = "CODING";
    const TYPE_START = 0.25;
    const PHRASE_DUR = 0.95;
    const LEVEL_START = TYPE_START + PHRASE_DUR;
    const LEVEL_DUR = 0.4;
    const LEVEL_AT = LEVEL_START + LEVEL_DUR;
    const HOLD = 0.7;
    const SCROLL_AT = LEVEL_AT + HOLD;

    const typeEl = document.getElementById("type-text");
    const levelEl = document.getElementById("level-text");
    const cursorEl = document.getElementById("cursor");

    const driver = { v: 0 };
    tl.to(driver, {
      v: PHRASE_FIXED.length,
      duration: PHRASE_DUR,
      ease: "none",
      onUpdate() { typeEl.textContent = PHRASE_FIXED.slice(0, Math.round(driver.v)); }
    }, TYPE_START);

    const lvlDriver = { v: 0 };
    tl.to(lvlDriver, {
      v: WORD_LEVEL.length,
      duration: LEVEL_DUR,
      ease: "none",
      onUpdate() { levelEl.textContent = WORD_LEVEL.slice(0, Math.round(lvlDriver.v)); }
    }, LEVEL_START);

    const blinkDriver = { p: 0 };
    tl.to(blinkDriver, {
      p: Math.PI * 2 * 8,
      duration: SCROLL_AT,
      ease: "none",
      onUpdate() { cursorEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0"; }
    }, 0);

    const ITEM_H = 80;
    const innerEl = document.getElementById("ticker-inner");
    const CENTER_OFFSET = ITEM_H;

    const scroll = { pos: 0, reveal: 0 };
    function applyTicker() {
      const y = CENTER_OFFSET - scroll.pos * ITEM_H;
      innerEl.style.transform = `translateY(${y}px)`;
      const items = innerEl.children;
      for (let i = 0; i < items.length; i++) {
        const dist = Math.abs(i - scroll.pos);
        if (dist < 0.4) {
          items[i].style.opacity = "1";
          items[i].style.color = "#e85102";
        } else {
          items[i].style.opacity = String(scroll.reveal);
          items[i].style.color = dist < 1.2 ? "#f0844a" : "#f7bfa0";
        }
      }
    }
    applyTicker();

    /* Position ticker-wrap absolutely so it doesn't affect flex centering of the phrase.
       Initially hidden (opacity 0), positioned left of center.
       When it appears, shift both phrase (#type-line) and ticker together so the combined
       block stays centered within #scene1-inner. */
    const TICKER_WIDTH = 340;
    const TICKER_MARGIN = 16;
    const COMBINED_WIDTH = TICKER_WIDTH + TICKER_MARGIN;
    const SLIDE_DUR = 0.45;

    tl.to("#type-line", {
      x: -(COMBINED_WIDTH / 2),
      duration: SLIDE_DUR,
      ease: "power2.inOut"
    }, LEVEL_AT + 0.15);

    tl.to("#ticker-wrap", {
      opacity: 1,
      duration: SLIDE_DUR,
      ease: "power2.inOut"
    }, LEVEL_AT + 0.15);

    tl.to("#cursor", { opacity: 0, duration: 0.2, ease: "none" }, LEVEL_AT + 0.1);

    tl.to(scroll, {
      reveal: 1,
      duration: 0.3,
      ease: "power1.out",
      onUpdate: applyTicker
    }, SCROLL_AT - 0.1);

    tl.to(scroll, {
      pos: 6,
      duration: 2.6,
      ease: "power2.inOut",
      onUpdate: applyTicker
    }, SCROLL_AT);

    window.__timelines["main"] = tl;
  </script>
</body>

</html>

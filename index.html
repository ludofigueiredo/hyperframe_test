<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      src: local("Inter");
    }

    :root {
      --ink: #1d1d1f;
      --accent: #0066cc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: #eef4fb;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }

    /* Iridescent background layers */
    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
    }

    #bg-dots {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1080px;
      opacity: 0.18;
    }

    /* Scene */
    #scene1 { position: absolute; inset: 0; }

    #scene1-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #type-line {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }

    #phrase-box {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    #type-text {
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1.1;
      white-space: nowrap;
    }

    #cursor {
      display: inline-block;
      width: 3px;
      height: 60px;
      background: var(--accent);
      margin-left: 6px;
      align-self: flex-end;
      flex: 0 0 auto;
      opacity: 1;
      margin-bottom: 4px;
    }

    #ticker-wrap {
      position: relative;
      display: inline-block;
      width: 320px;
      height: 80px;
      margin-left: 16px;
    }

    #ticker {
      position: absolute;
      left: 0;
      top: -70px;
      width: 100%;
      height: 240px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 66%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 66%, transparent 100%);
    }

    #ticker-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .kw-item {
      height: 80px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      color: #99c9f5;
    }
  </style>
</head>

<body>
  <div data-hf-id="hf-ph1f" id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1080">

    <!-- Iridescent background canvas -->
    <canvas data-hf-id="hf-eo1d" id="bg-canvas" width="1080" height="1080"></canvas>

    <!-- Dot-grid overlay (SVG pattern, matches ref texture) -->
    <svg data-hf-id="hf-uxzk" id="bg-dots" xmlns="http://www.w3.org/2000/svg">
      <defs data-hf-id="hf-mh0t">
        <pattern data-hf-id="hf-h32h" id="dot-grid" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
          <circle data-hf-id="hf-305w" cx="6" cy="6" r="1" fill="#5ba8d8" />
        </pattern>
      </defs>
      <rect data-hf-id="hf-26tq" width="1080" height="1080" fill="url(#dot-grid)" />
    </svg>

    <!-- SCENE 1: Typewriter + keyword ticker (0–6s) -->
    <div data-hf-id="hf-67e6" id="scene1" class="clip" data-start="0" data-duration="6" data-track-index="0" data-layout-allow-overlap="true">
      <div data-hf-id="hf-knmf" id="scene1-inner">
        <div data-hf-id="hf-9jes" id="type-line">
          <span data-hf-id="hf-49nd" id="phrase-box"><span data-hf-id="hf-0neq" id="type-text"></span><span data-hf-id="hf-w7si" id="ticker-wrap" data-layout-allow-overflow="true">
              <span data-hf-id="hf-ayox" id="ticker" data-layout-allow-overflow="true">
                <span data-hf-id="hf-pgsv" id="ticker-inner">
                  <span data-hf-id="hf-lvl0" id="kw-level" class="kw-item"><span data-hf-id="hf-kyjs" id="level-text"></span><span data-hf-id="hf-42e8" id="cursor"></span></span>
                  <span data-hf-id="hf-vipr" class="kw-item">CODE</span>
                  <span data-hf-id="hf-vaag" class="kw-item">REPORT</span>
                  <span data-hf-id="hf-6aji" class="kw-item">DESIGN</span>
                  <span data-hf-id="hf-ccc4" class="kw-item">VISION</span>
                  <span data-hf-id="hf-lvl1" class="kw-item">LEVEL</span>
                </span>
              </span>
            </span>
          </span>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* -----------------------------------------------
       IRIDESCENT BACKGROUND
       Canvas 2D — deterministic, driven by GSAP time.
       Large elliptical blobs whose position AND hue
       shift slowly — aurora-style movement like the
       iris.mp4 reference, but in very light pastels
       on a near-white base.
    ----------------------------------------------- */
    const bgCanvas = document.getElementById("bg-canvas");
    const ctx = bgCanvas.getContext("2d");
    const W = 1080, H = 1080;

    /* HSL helper — keeps saturation/lightness fixed, only hue shifts */
    function hsl(h, s, l, a) {
      return `hsla(${h % 360},${s}%,${l}%,${a})`;
    }

    /* Draw one elliptical blob using a scaled radial gradient.
       rx/ry are radii in pixels, angle rotates the ellipse. */
    function drawBlob(cx, cy, rx, ry, angle, colorInner, colorOuter) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.scale(rx / ry, 1);
      const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, ry);
      grad.addColorStop(0,   colorInner);
      grad.addColorStop(0.5, colorInner.replace(/[\d.]+\)$/, "0.3)"));
      grad.addColorStop(1,   colorOuter);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, ry, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function renderBg(t) {
      ctx.clearRect(0, 0, W, H);

      /* Base */
      ctx.fillStyle = "#f0f5fb";
      ctx.fillRect(0, 0, W, H);

      const TAU = Math.PI * 2;

      /* --- Blob A: blue → cyan hue sweep, drifts top-left to center */
      {
        const hue  = 200 + 30 * Math.sin(t * TAU * 0.7);   /* 200–230 */
        const cx   = W * (0.15 + 0.25 * Math.sin(t * TAU * 0.31));
        const cy   = H * (0.20 + 0.20 * Math.cos(t * TAU * 0.27));
        const ang  = 0.4 + 0.3 * Math.sin(t * TAU * 0.19);
        drawBlob(cx, cy, 680, 420, ang,
          hsl(hue, 70, 88, 0.72),
          hsl(hue, 60, 92, 0));
      }

      /* --- Blob B: lavender → periwinkle, drifts bottom-right */
      {
        const hue  = 240 + 30 * Math.cos(t * TAU * 0.53);  /* 240–270 */
        const cx   = W * (0.80 + 0.15 * Math.cos(t * TAU * 0.41));
        const cy   = H * (0.75 + 0.18 * Math.sin(t * TAU * 0.37));
        const ang  = -0.5 + 0.4 * Math.cos(t * TAU * 0.23);
        drawBlob(cx, cy, 620, 380, ang,
          hsl(hue, 65, 87, 0.65),
          hsl(hue, 55, 93, 0));
      }

      /* --- Blob C: cyan → teal, sweeps across the middle */
      {
        const hue  = 185 + 25 * Math.sin(t * TAU * 0.44 + 1.2);
        const cx   = W * (0.50 + 0.35 * Math.sin(t * TAU * 0.22));
        const cy   = H * (0.55 + 0.15 * Math.sin(t * TAU * 0.48));
        const ang  = 0.2 + 0.5 * Math.sin(t * TAU * 0.16);
        drawBlob(cx, cy, 550, 340, ang,
          hsl(hue, 60, 90, 0.55),
          hsl(hue, 50, 95, 0));
      }

      /* --- Blob D: soft rose/violet accent, top-right corner */
      {
        const hue  = 280 + 20 * Math.sin(t * TAU * 0.61 + 2.0);  /* 280–300 */
        const cx   = W * (0.88 + 0.10 * Math.sin(t * TAU * 0.34));
        const cy   = H * (0.12 + 0.14 * Math.cos(t * TAU * 0.29));
        const ang  = 0.8 + 0.3 * Math.cos(t * TAU * 0.21);
        drawBlob(cx, cy, 480, 300, ang,
          hsl(hue, 55, 90, 0.50),
          hsl(hue, 45, 95, 0));
      }

      /* --- Specular glint: slow diagonal sweep across the full 6s */
      const sx = -300 + (W + 600) * t;
      const sg = ctx.createLinearGradient(sx - 250, 0, sx + 250, H * 0.8);
      sg.addColorStop(0,    "rgba(255,255,255,0)");
      sg.addColorStop(0.42, "rgba(255,255,255,0.18)");
      sg.addColorStop(0.50, "rgba(255,255,255,0.28)");
      sg.addColorStop(0.58, "rgba(255,255,255,0.18)");
      sg.addColorStop(1,    "rgba(255,255,255,0)");
      ctx.fillStyle = sg;
      ctx.fillRect(0, 0, W, H);
    }

    /* Initial paint */
    renderBg(0);

    /* -----------------------------------------------
       MAIN TIMELINE
    ----------------------------------------------- */
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* Drive background from timeline time */
    const bgDriver = { t: 0 };
    tl.to(bgDriver, {
      t: 1,
      duration: 6,
      ease: "none",
      onUpdate() { renderBg(bgDriver.t); }
    }, 0);

    const PHRASE_FIXED = "Bring AI to next";
    const WORD_LEVEL   = "LEVEL";
    const TYPE_START   = 0.25;
    const PHRASE_DUR   = 0.95;
    const LEVEL_START  = TYPE_START + PHRASE_DUR;
    const LEVEL_DUR    = 0.4;
    const LEVEL_AT     = LEVEL_START + LEVEL_DUR;
    const HOLD         = 0.7;
    const SCROLL_AT    = LEVEL_AT + HOLD;

    const typeEl   = document.getElementById("type-text");
    const levelEl  = document.getElementById("level-text");
    const cursorEl = document.getElementById("cursor");

    const driver = { v: 0 };
    tl.to(driver, {
      v: PHRASE_FIXED.length,
      duration: PHRASE_DUR,
      ease: "none",
      onUpdate() { typeEl.textContent = PHRASE_FIXED.slice(0, Math.round(driver.v)); }
    }, TYPE_START);

    const lvlDriver = { v: 0 };
    tl.to(lvlDriver, {
      v: WORD_LEVEL.length,
      duration: LEVEL_DUR,
      ease: "none",
      onUpdate() { levelEl.textContent = WORD_LEVEL.slice(0, Math.round(lvlDriver.v)); }
    }, LEVEL_START);

    const blinkDriver = { p: 0 };
    tl.to(blinkDriver, {
      p: Math.PI * 2 * 8,
      duration: SCROLL_AT,
      ease: "none",
      onUpdate() { cursorEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0"; }
    }, 0);

    const ITEM_H = 80;
    const innerEl = document.getElementById("ticker-inner");
    const CENTER_OFFSET = ITEM_H;

    const scroll = { pos: 0, reveal: 0 };
    function applyTicker() {
      const y = CENTER_OFFSET - scroll.pos * ITEM_H;
      innerEl.style.transform = `translateY(${y}px)`;
      const items = innerEl.children;
      for (let i = 0; i < items.length; i++) {
        const dist = Math.abs(i - scroll.pos);
        if (dist < 0.4) {
          items[i].style.opacity = "1";
          items[i].style.color = "#0066cc";
        } else {
          items[i].style.opacity = String(scroll.reveal);
          items[i].style.color = dist < 1.2 ? "#4d9fe8" : "#99c9f5";
        }
      }
    }
    applyTicker();

    tl.set("#cursor", { opacity: 0, display: "none" }, SCROLL_AT);

    tl.to(scroll, {
      reveal: 1,
      duration: 0.3,
      ease: "power1.out",
      onUpdate: applyTicker
    }, SCROLL_AT - 0.1);

    tl.to(scroll, {
      pos: 5,
      duration: 2.4,
      ease: "power2.inOut",
      onUpdate: applyTicker
    }, SCROLL_AT);

    window.__timelines["main"] = tl;
  </script>
</body>

</html>

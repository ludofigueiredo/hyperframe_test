<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      src: local("Inter");
    }

    :root {
      --bg: #f5f5f7;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --faint: #c7c7cc;
      --accent: #0066cc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      font-family: "Inter", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      background: var(--bg);
      overflow: hidden;
    }

    #scene1 {
      position: absolute;
      inset: 0;
    }

    #scene1-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #type-line {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }

    #phrase-box {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    #type-text {
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1.1;
      white-space: nowrap;
    }

    #cursor {
      display: inline-block;
      width: 3px;
      height: 60px;
      background: var(--accent);
      margin-left: 6px;
      align-self: flex-end;
      flex: 0 0 auto;
      opacity: 1;
      margin-bottom: 4px;
    }

    #ticker-wrap {
      position: relative;
      display: inline-block;
      width: 320px;
      height: 80px;
      margin-left: 16px;
    }

    #ticker {
      position: absolute;
      left: 0;
      top: -70px;
      width: 100%;
      height: 240px;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 66%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 66%, transparent 100%);
    }

    #ticker-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .kw-item {
      height: 80px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      color: var(--faint);
    }
  </style>
</head>

<body>
  <div data-hf-id="hf-ph1f" id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080"
    data-height="1080">

    <!-- SCENE 1: Typewriter + keyword ticker (0–6s) -->
    <div data-hf-id="hf-67e6" id="scene1" class="clip" data-start="0" data-duration="6" data-track-index="0"
      data-layout-allow-overlap="true">
      <div data-hf-id="hf-knmf" id="scene1-inner">
        <div data-hf-id="hf-9jes" id="type-line">
          <span data-hf-id="hf-49nd" id="phrase-box"><span data-hf-id="hf-0neq" id="type-text"></span><span
              data-hf-id="hf-w7si" id="ticker-wrap" data-layout-allow-overflow="true">
              <span data-hf-id="hf-ayox" id="ticker" data-layout-allow-overflow="true">
                <span data-hf-id="hf-pgsv" id="ticker-inner">
                  <!-- index 0: LEVEL (typed by cursor) -->
                  <span data-hf-id="hf-lvl0" id="kw-level" class="kw-item"><span data-hf-id="hf-kyjs"
                      id="level-text"></span><span data-hf-id="hf-42e8" id="cursor"></span></span>
                  <!-- indices 1–4: keywords -->
                  <span data-hf-id="hf-vipr" class="kw-item">CODE</span>
                  <span data-hf-id="hf-vaag" class="kw-item">REPORT</span>
                  <span data-hf-id="hf-6aji" class="kw-item">DESIGN</span>
                  <span data-hf-id="hf-ccc4" class="kw-item">VISION</span>
                  <!-- index 5: LEVEL again — loop illusion -->
                  <span data-hf-id="hf-lvl1" class="kw-item">LEVEL</span>
                </span>
              </span>
            </span>
          </span>
        </div>
      </div>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const PHRASE_FIXED = "Bring AI to next";
    const WORD_LEVEL = "LEVEL";
    const TYPE_START = 0.25;
    const PHRASE_DUR = 0.95;
    const LEVEL_START = TYPE_START + PHRASE_DUR;   /* 1.2s */
    const LEVEL_DUR = 0.4;
    const LEVEL_AT = LEVEL_START + LEVEL_DUR;      /* 1.6s */
    const HOLD = 1.0;
    const SCROLL_AT = LEVEL_AT + HOLD;             /* 2.6s */

    const typeEl = document.getElementById("type-text");
    const levelEl = document.getElementById("level-text");
    const cursorEl = document.getElementById("cursor");

    /* Type the fixed phrase */
    const driver = { v: 0 };
    tl.to(driver, {
      v: PHRASE_FIXED.length,
      duration: PHRASE_DUR,
      ease: "none",
      onUpdate() {
        typeEl.textContent = PHRASE_FIXED.slice(0, Math.round(driver.v));
      }
    }, TYPE_START);

    /* Type LEVEL into the ticker slot */
    const lvlDriver = { v: 0 };
    tl.to(lvlDriver, {
      v: WORD_LEVEL.length,
      duration: LEVEL_DUR,
      ease: "none",
      onUpdate() {
        levelEl.textContent = WORD_LEVEL.slice(0, Math.round(lvlDriver.v));
      }
    }, LEVEL_START);

    /* Cursor blink via sin driver */
    const blinkDriver = { p: 0 };
    tl.to(blinkDriver, {
      p: Math.PI * 2 * 8,
      duration: SCROLL_AT,
      ease: "none",
      onUpdate() {
        cursorEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
      }
    }, 0);

    /* Ticker scroll — ends at index 8 (duplicate LEVEL) for loop illusion */
    const ITEM_H = 80;
    const innerEl = document.getElementById("ticker-inner");
    const CENTER_OFFSET = ITEM_H;

    const scroll = { pos: 0, reveal: 0 };
    function applyTicker() {
      const y = CENTER_OFFSET - scroll.pos * ITEM_H;
      innerEl.style.transform = `translateY(${y}px)`;
      const items = innerEl.children;
      for (let i = 0; i < items.length; i++) {
        const dist = Math.abs(i - scroll.pos);
        if (dist < 0.4) {
          items[i].style.opacity = "1";
          items[i].style.color = "#1d1d1f";
        } else {
          items[i].style.opacity = String(scroll.reveal);
          items[i].style.color = dist < 1.2 ? "#9a9aa0" : "#c7c7cc";
        }
      }
    }
    applyTicker();

    tl.set("#cursor", { opacity: 0, display: "none" }, SCROLL_AT);

    tl.to(scroll, {
      reveal: 1,
      duration: 0.3,
      ease: "power1.out",
      onUpdate: applyTicker
    }, SCROLL_AT - 0.1);

    /* Scroll from LEVEL(0) through 4 keywords and land on LEVEL(5) */
    tl.to(scroll, {
      pos: 5,
      duration: 2.4,
      ease: "power2.inOut",
      onUpdate: applyTicker
    }, SCROLL_AT);

    window.__timelines["main"] = tl;
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      src: local("Inter");
    }

    :root {
      --bg:      #f5f5f7;
      --ink:     #1d1d1f;
      --muted:   #6e6e73;
      --accent:  #0066cc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      font-family: "Inter", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      background: var(--bg);
      overflow: hidden;
    }

    /* =============================================
       SCENE 1 — Typewriter "Bring AI to next level."
       ============================================= */
    #scene1 {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    #type-line {
      display: flex;
      align-items: baseline;
      gap: 0;
    }

    #type-text {
      font-family: "Inter", sans-serif;
      font-size: 72px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
    }

    /* Blinking cursor — controlled by GSAP, not CSS animation */
    #cursor {
      display: inline-block;
      width: 3px;
      height: 74px;
      background: var(--accent);
      margin-left: 6px;
      vertical-align: bottom;
      opacity: 1;
    }

    /* =============================================
       SCENE 2 — "level." isolated, big
       ============================================= */
    #scene2 {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    #big-level {
      font-family: "Inter", sans-serif;
      font-size: 160px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.05em;
      line-height: 1;
      white-space: nowrap;
    }

    /* Accent dot on the period */
    #big-level .dot {
      color: var(--accent);
    }

    /* =============================================
       SCENE 3 — Signature
       ============================================= */
    #scene3 {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0;
      opacity: 0;
    }

    .sig-mask {
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #sig-name {
      font-family: "Inter", sans-serif;
      font-size: 48px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.03em;
      text-align: center;
      white-space: nowrap;
    }

    #sig-title {
      font-family: "Inter", sans-serif;
      font-size: 26px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div data-hf-id="hf-oqai" id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1080">

    <!-- SCENE 1: Typewriter (0–2.8s) -->
    <div data-hf-id="hf-din8" id="scene1" class="clip" data-start="0" data-duration="2.8" data-track-index="1">
      <div data-hf-id="hf-9jes" id="type-line">
        <span data-hf-id="hf-0neq" id="type-text"></span><span data-hf-id="hf-42e8" id="cursor"></span>
      </div>
    </div>

    <!-- SCENE 2: "level." isolated (2.8–4.8s) -->
    <div data-hf-id="hf-wv8m" id="scene2" class="clip" data-start="2.8" data-duration="2" data-track-index="2">
      <div data-hf-id="hf-27l6" id="big-level">level<span data-hf-id="hf-6jgg" class="dot">.</span></div>
    </div>

    <!-- SCENE 3: Signature (4.8–7s) -->
    <div data-hf-id="hf-uku0" id="scene3" class="clip" data-start="4.8" data-duration="2.2" data-track-index="3">
      <div data-hf-id="hf-mqrh" class="sig-mask" data-layout-allow-overflow="true"><div data-hf-id="hf-0h0z" id="sig-name">Ludovic Figueiredo</div></div>
      <div data-hf-id="hf-dfyp" class="sig-mask" data-layout-allow-overflow="true"><div data-hf-id="hf-5kxk" id="sig-title">Tech &amp; AI Addict</div></div>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* -----------------------------------------------
       SCENE 1 — Typewriter
       Full phrase: "Bring AI to next level."
       Types up to "next" then pauses before scene 2
       takes over with "level." at full size.
       Cursor blinks via sine driver (deterministic).
       ----------------------------------------------- */
    const FULL_TEXT  = "Bring AI to next";
    const TYPE_START = 0.3;
    const TYPE_DUR   = 1.6; /* total typing duration */

    tl.set("#scene1", { opacity: 1 }, 0);
    tl.set("#scene2", { opacity: 0 }, 0);
    tl.set("#scene3", { opacity: 0 }, 0);

    /* Typewriter driver — onUpdate slices the string */
    const typeEl   = document.getElementById("type-text");
    const cursorEl = document.getElementById("cursor");

    const driver = { v: 0 };
    tl.to(driver, {
      v: FULL_TEXT.length,
      duration: TYPE_DUR,
      ease: "none",
      onUpdate() {
        typeEl.textContent = FULL_TEXT.slice(0, Math.round(driver.v));
      }
    }, TYPE_START);

    /* Cursor blink — sin-based, not CSS animation (deterministic) */
    const TOTAL_S1 = 2.8;
    const BLINK_CYCLES = 5; /* blinks across scene 1 */
    const blinkDriver = { p: 0 };
    tl.to(blinkDriver, {
      p: Math.PI * 2 * BLINK_CYCLES,
      duration: TOTAL_S1,
      ease: "none",
      onUpdate() {
        cursorEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
      }
    }, 0);

    /* Cursor + text fade out before scene 2 */
    tl.to("#scene1", { opacity: 0, duration: 0.25, ease: "power1.in" }, 2.5);
    tl.set("#scene1", { opacity: 0 }, 2.8);

    /* -----------------------------------------------
       SCENE 2 — "level."
       Mask-reveal slam: slides up from below + slight
       scale, holds with a breath, exits upward.
       ----------------------------------------------- */
    tl.set("#scene2", { opacity: 1 }, 2.8);

    tl.fromTo("#big-level",
      { y: 160, scale: 1.08 },
      { y: 0, scale: 1, duration: 0.5, ease: "expo.out" },
      2.8
    );

    /* One slow breath hold */
    tl.to("#big-level",
      { scale: 1.025, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 },
      3.5
    );

    /* Exit up */
    tl.to("#big-level", { y: -180, opacity: 0, duration: 0.3, ease: "power3.in" }, 4.4);
    tl.set("#scene2", { opacity: 0 }, 4.8);
    tl.set("#big-level", { y: 160, scale: 1.08, opacity: 1 }, 4.8);

    /* -----------------------------------------------
       SCENE 3 — Signature
       Name then tagline slide up from masks.
       Fade out at end.
       ----------------------------------------------- */
    tl.set("#scene3", { opacity: 1 }, 4.8);

    tl.fromTo("#sig-name",  { y: 60 }, { y: 0, duration: 0.42, ease: "power3.out" }, 5.0);
    tl.fromTo("#sig-title", { y: 38 }, { y: 0, duration: 0.38, ease: "power3.out" }, 5.4);

    tl.to("#scene3", { opacity: 0, duration: 0.4, ease: "power1.in" }, 6.5);

    /* Hard kills */
    tl.set("#scene3",    { opacity: 0 }, 7.0);
    tl.set("#sig-name",  { y: 60 },      7.0);
    tl.set("#sig-title", { y: 38 },      7.0);

    window.__timelines["main"] = tl;
  </script>
</body>

</html>

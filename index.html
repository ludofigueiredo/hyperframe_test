<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      src: local("Inter");
    }

    :root {
      --bg:      #f5f5f7;
      --ink:     #1d1d1f;
      --muted:   #6e6e73;
      --faint:   #c7c7cc;
      --accent:  #0066cc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      font-family: "Inter", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      background: var(--bg);
      overflow: hidden;
    }

    /* =============================================
       SCENE 1 — Typewriter + scrolling keyword ticker
       (0–4s)
       "Bring AI to next " stays fixed; "level" is
       replaced by a vertical ticker of AI keywords
       that scrolls upward, the centered word in black
       and the others faded by distance.
       ============================================= */
    #scene1 { position: absolute; inset: 0; }
    #scene1-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Centered. During typing the full phrase is centered on its own;
       when the ticker appears, GSAP shifts the line so the
       phrase+ticker block stays optically centered (see script). */
    #type-line {
      display: flex;
      align-items: baseline;
      justify-content: center;
    }

    /* Relative box so the absolutely-placed ticker anchors at its
       right edge. The phrase itself sizes this box and centers in
       #type-line; the ticker overflows to the right out of flow. */
    #phrase-box {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      white-space: nowrap;
    }

    #type-text {
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1.1;
      white-space: nowrap;
    }

    #cursor {
      display: inline-block;
      width: 3px;
      height: 60px;
      background: var(--accent);
      margin-left: 6px;
      vertical-align: bottom;
      opacity: 1;
    }

    /* Ticker — sits right where "level" was, replaces it.
       Width fits the widest keyword tightly so the whole line
       stays centered. A 3-slot window shows the centered keyword
       plus faint neighbors above/below, vertically centered on the
       phrase's text line. */
    /* Absolutely positioned and OUT OF FLOW, so the typed phrase
       always centers on its own during typing. Anchored just after
       the phrase via left:100%. The centered word (LEVEL at first)
       is part of the typed sentence; the scroll then rolls it into
       the AI keywords — one continuous element. */
    #ticker-wrap {
      position: absolute;
      left: 100%;
      bottom: 0;
      width: 360px;           /* fits "ANALYSIS"/"RESEARCH" tightly */
      height: 80px;
      margin-left: 14px;      /* space after "next" */
      opacity: 0;
    }

    /* The masked window — 3 slots tall, centered on the phrase line.
       Pulled up/left so the MIDDLE slot overlaps the typed text line. */
    #ticker {
      position: absolute;
      left: 0;
      top: -80px;             /* center the middle slot on the line */
      width: 100%;
      height: 240px;          /* 3 slots × 80px */
      overflow: hidden;
      /* soft fade top/bottom so neighbors dissolve as they pass */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 66%, transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0%, #000 34%, #000 66%, transparent 100%);
    }

    #ticker-inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .kw-item {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-family: "Inter", sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      white-space: nowrap;
      color: var(--faint);
    }

    /* =============================================
       SCENE 2 — Signature (4–6s)
       ============================================= */
    #scene2 { position: absolute; inset: 0; }
    #scene2-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0;
    }

    .sig-mask {
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #sig-name {
      font-family: "Inter", sans-serif;
      font-size: 48px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.03em;
      text-align: center;
      white-space: nowrap;
    }

    #sig-title {
      font-family: "Inter", sans-serif;
      font-size: 26px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div data-hf-id="hf-ph1f" id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1080">

    <!-- SCENE 1: Typewriter + keyword ticker (0–4s) -->
    <div data-hf-id="hf-67e6" id="scene1" class="clip" data-start="0" data-duration="4" data-track-index="1" data-layout-allow-overlap="true">
      <div data-hf-id="hf-knmf" id="scene1-inner">
        <div data-hf-id="hf-9jes" id="type-line">
          <span data-hf-id="hf-49nd" id="phrase-box"><span data-hf-id="hf-0neq" id="type-text"></span><span data-hf-id="hf-42e8" id="cursor"></span><span data-hf-id="hf-w7si" id="ticker-wrap" data-layout-allow-overflow="true">
            <span data-hf-id="hf-ayox" id="ticker" data-layout-allow-overflow="true">
              <span data-hf-id="hf-pgsv" id="ticker-inner">
                <span data-hf-id="hf-lvl0" id="kw-level" class="kw-item">LEVEL</span>
                <span data-hf-id="hf-vipr" class="kw-item">ANALYSIS</span>
                <span data-hf-id="hf-vaag" class="kw-item">CODE</span>
                <span data-hf-id="hf-6aji" class="kw-item">DOCS</span>
                <span data-hf-id="hf-ccc4" class="kw-item">FIXING</span>
                <span data-hf-id="hf-b8hu" class="kw-item">SEO</span>
                <span data-hf-id="hf-2hvs" class="kw-item">RESEARCH</span>
                <span data-hf-id="hf-gfbn" class="kw-item">WRITING</span>
                <span data-hf-id="hf-3q0v" class="kw-item">ANALYSIS</span>
                <span data-hf-id="hf-gncg" class="kw-item">CODE</span>
                <span data-hf-id="hf-2a4i" class="kw-item">DOCS</span>
              </span>
            </span>
          </span>
        </span></div>
      </div>
    </div>

    <!-- SCENE 2: Signature (4–6s) -->
    <div data-hf-id="hf-z1je" id="scene2" class="clip" data-start="4" data-duration="2" data-track-index="2">
      <div data-hf-id="hf-hzkg" id="scene2-inner">
        <div data-hf-id="hf-mqrh" class="sig-mask" data-layout-allow-overflow="true"><div data-hf-id="hf-0h0z" id="sig-name">Ludovic Figueiredo</div></div>
        <div data-hf-id="hf-dfyp" class="sig-mask" data-layout-allow-overflow="true"><div data-hf-id="hf-5kxk" id="sig-title">Tech &amp; AI Addict</div></div>
      </div>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* -----------------------------------------------
       SCENE 1 — Typewriter that rolls into a keyword ticker
       Phase A (0–~1.3s): type "Bring AI to next " — cursor blinks.
       Phase B (~1.3s): "LEVEL" appears as the centered ticker word,
         completing the sentence "Bring AI to next LEVEL".
       Phase C (~1.7–3.6s): the ticker scrolls — LEVEL rolls up into
         the AI keywords (ANALYSIS, CODE, DOCS, …) one by one.
       It's ONE continuous element: LEVEL is just the first item.
       ----------------------------------------------- */
    const PHRASE_FIXED = "Bring AI to next ";
    const TYPE_START   = 0.25;
    const TYPE_DUR     = 1.0;
    const LEVEL_AT     = 1.35;   /* LEVEL completes the sentence */
    const SCROLL_AT    = 1.85;   /* keywords start rolling */

    const typeEl   = document.getElementById("type-text");
    const cursorEl = document.getElementById("cursor");

    /* Phase A — type the fixed phrase only */
    const driver = { v: 0 };
    tl.to(driver, {
      v: PHRASE_FIXED.length,
      duration: TYPE_DUR,
      ease: "none",
      onUpdate() {
        typeEl.textContent = PHRASE_FIXED.slice(0, Math.round(driver.v));
      }
    }, TYPE_START);

    /* Cursor blink until LEVEL lands (sin driver, deterministic) */
    const blinkDriver = { p: 0 };
    tl.to(blinkDriver, {
      p: Math.PI * 2 * 3,
      duration: LEVEL_AT,
      ease: "none",
      onUpdate() {
        cursorEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
      }
    }, 0);

    /* Phase B — LEVEL completes the sentence: reveal the ticker (with
       LEVEL centered) and slide the line left so phrase + LEVEL reads
       optically centered. Cursor hides — the sentence is complete. */
    tl.set("#cursor", { opacity: 0, display: "none" }, LEVEL_AT);
    tl.to("#ticker-wrap", { opacity: 1, duration: 0.28, ease: "power2.out" }, LEVEL_AT);
    tl.to("#type-line", { x: -110, duration: 0.4, ease: "power2.inOut" }, LEVEL_AT);

    /* Phase C — scroll the ticker upward.
       ITEM_H = 80px, window is 3 slots tall (240px); the MIDDLE slot
       (top offset 80px) is on the phrase line. item0 (LEVEL) sits in
       the middle slot at pos=0 → CENTER_OFFSET = 80. */
    const ITEM_H = 80;
    const innerEl = document.getElementById("ticker-inner");
    const CENTER_OFFSET = ITEM_H; /* 80px — item0 (LEVEL) centered */

    /* scroll.pos counts items advanced (0 = LEVEL centered) */
    const scroll = { pos: 0 };
    function applyTicker() {
      const y = CENTER_OFFSET - scroll.pos * ITEM_H;
      innerEl.style.transform = `translateY(${y}px)`;

      /* color each item by distance from the centered slot */
      const items = innerEl.children;
      for (let i = 0; i < items.length; i++) {
        const dist = Math.abs(i - scroll.pos);
        let color;
        if (dist < 0.4)      color = "#1d1d1f";  /* centered — black */
        else if (dist < 1.2) color = "#9a9aa0";  /* adjacent — grey */
        else                 color = "#c7c7cc";  /* far — faint */
        items[i].style.color = color;
      }
    }
    applyTicker();

    /* Roll LEVEL(0) → index 7 across the dwell. power1.inOut gives a
       smooth, continuous scroll with gentle ease in/out. */
    tl.to(scroll, {
      pos: 7,
      duration: 1.75,
      ease: "power1.inOut",
      onUpdate: applyTicker
    }, SCROLL_AT);

    /* Fade scene 1 out before signature */
    tl.to("#scene1-inner", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.7);
    tl.set("#scene1-inner", { opacity: 0 }, 4.0);

    /* -----------------------------------------------
       SCENE 2 — Signature mask-reveal
       ----------------------------------------------- */
    tl.set("#scene2-inner", { opacity: 1 }, 4.0);

    tl.fromTo("#sig-name",  { y: 60 }, { y: 0, duration: 0.42, ease: "power3.out" }, 4.2);
    tl.fromTo("#sig-title", { y: 38 }, { y: 0, duration: 0.38, ease: "power3.out" }, 4.55);

    tl.to("#scene2-inner", { opacity: 0, duration: 0.35, ease: "power1.in" }, 5.55);

    /* Hard kills */
    tl.set("#scene2-inner", { opacity: 0 }, 6.0);
    tl.set("#sig-name",  { y: 60 }, 6.0);
    tl.set("#sig-title", { y: 38 }, 6.0);

    window.__timelines["main"] = tl;
  </script>
</body>

</html>

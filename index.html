<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

  <style>
    @font-face {
      font-family: "Inter";
      font-weight: 100 900;
      src: local("Inter");
    }

    :root {
      --bg:      #f5f5f7;
      --ink:     #1d1d1f;
      --muted:   #6e6e73;
      --accent:  #0066cc;
      --highlight: #00e000;   /* vert vif — highlight bloc derrière le mot slam */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      font-family: "Inter", sans-serif;
    }

    #root {
      position: relative;
      width: 1080px;
      height: 1080px;
      background: var(--bg);
      overflow: hidden;
    }

    /* =============================================
       SCENE 1 — Typewriter "Bring AI to next level"
       (0–2s)
       ============================================= */
    #scene1 { position: absolute; inset: 0; }
    #scene1-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 80px;
    }

    #type-line {
      display: flex;
      align-items: baseline;
      justify-content: center;
      max-width: 920px;
    }

    #type-text {
      font-family: "Inter", sans-serif;
      font-size: 68px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-align: center;
    }

    #cursor {
      display: inline-block;
      width: 3px;
      height: 64px;
      background: var(--accent);
      margin-left: 6px;
      vertical-align: bottom;
      opacity: 1;
    }

    /* =============================================
       SCENE 2 — Keyword slam stack (2–4.5s)
       Each keyword slams in horizontally with a
       vivid green highlight block behind it.
       ============================================= */
    #scene2 { position: absolute; inset: 0; }
    #scene2-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* mask clips the horizontal slam */
    .kw-mask {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      width: 1080px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .kw {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 24px;
      font-family: "Inter", sans-serif;
      font-size: 110px;
      font-weight: 800;
      color: var(--ink);
      letter-spacing: -0.04em;
      line-height: 1;
      white-space: nowrap;
    }

    /* the green highlight block sits behind the text */
    .kw .hl {
      position: absolute;
      inset: 0;
      background: var(--highlight);
      z-index: -1;
      transform-origin: left center;
    }

    /* keyword that is the headline of scene 2 (smaller eyebrow) */
    #kw-eyebrow {
      position: absolute;
      left: 50%;
      top: calc(50% - 180px);
      transform: translateX(-50%);
      font-family: "Inter", sans-serif;
      font-size: 30px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.02em;
      white-space: nowrap;
      opacity: 0;
    }

    /* =============================================
       SCENE 3 — Signature (4.5–6s)
       ============================================= */
    #scene3 { position: absolute; inset: 0; }
    #scene3-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0;
    }

    .sig-mask {
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #sig-name {
      font-family: "Inter", sans-serif;
      font-size: 48px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.03em;
      text-align: center;
      white-space: nowrap;
    }

    #sig-title {
      font-family: "Inter", sans-serif;
      font-size: 26px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: -0.01em;
      text-align: center;
      white-space: nowrap;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1080">

    <!-- SCENE 1: Typewriter (0–2s) -->
    <div id="scene1" class="clip" data-start="0" data-duration="2" data-track-index="1">
      <div id="scene1-inner">
        <div id="type-line">
          <span id="type-text"></span><span id="cursor"></span>
        </div>
      </div>
    </div>

    <!-- SCENE 2: Keyword slam stack (2–4.5s) -->
    <div id="scene2" class="clip" data-start="2" data-duration="2.5" data-track-index="2" data-layout-allow-overlap="true">
      <div id="scene2-inner">
        <div id="kw-eyebrow">L'IA fait le travail</div>
        <div class="kw-mask" data-layout-allow-overflow="true">
          <div id="kw-analyse" class="kw"><span class="hl"></span>Analyse.</div>
        </div>
        <div class="kw-mask" data-layout-allow-overflow="true">
          <div id="kw-doc" class="kw"><span class="hl"></span>Génération de docs.</div>
        </div>
        <div class="kw-mask" data-layout-allow-overflow="true">
          <div id="kw-correction" class="kw"><span class="hl"></span>Correction.</div>
        </div>
      </div>
    </div>

    <!-- SCENE 3: Signature (4.5–6s) -->
    <div id="scene3" class="clip" data-start="4.5" data-duration="1.5" data-track-index="3">
      <div id="scene3-inner">
        <div class="sig-mask" data-layout-allow-overflow="true"><div id="sig-name">Ludovic Figueiredo</div></div>
        <div class="sig-mask" data-layout-allow-overflow="true"><div id="sig-title">Tech &amp; AI Addict</div></div>
      </div>
    </div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* -----------------------------------------------
       SCENE 1 — Typewriter "Bring AI to next level"
       Types the full phrase, blue cursor blinks
       deterministically (sin driver). Fades out.
       ----------------------------------------------- */
    const FULL_TEXT  = "Bring AI to next level";
    const TYPE_START = 0.25;
    const TYPE_DUR   = 1.2;
    const TOTAL_S1   = 2.0;

    /* Scene clip windows are managed by the framework (data-start/duration).
       We only animate the inner wrappers for soft fade transitions. */

    const typeEl   = document.getElementById("type-text");
    const cursorEl = document.getElementById("cursor");

    const driver = { v: 0 };
    tl.to(driver, {
      v: FULL_TEXT.length,
      duration: TYPE_DUR,
      ease: "none",
      onUpdate() {
        typeEl.textContent = FULL_TEXT.slice(0, Math.round(driver.v));
      }
    }, TYPE_START);

    /* Blue cursor blink — sin driver, deterministic */
    const BLINK_CYCLES = 4;
    const blinkDriver = { p: 0 };
    tl.to(blinkDriver, {
      p: Math.PI * 2 * BLINK_CYCLES,
      duration: TOTAL_S1,
      ease: "none",
      onUpdate() {
        cursorEl.style.opacity = Math.sin(blinkDriver.p) > 0 ? "1" : "0";
      }
    }, 0);

    /* Fade out inner before scene 2 */
    tl.to("#scene1-inner", { opacity: 0, duration: 0.25, ease: "power1.in" }, 1.75);
    tl.set("#scene1-inner", { opacity: 0 }, 2.0);

    /* -----------------------------------------------
       SCENE 2 — Keyword slam stack (Apple-ad style)
       Each keyword slams in from the left; a vivid
       green highlight wipes in behind it. Hard cut
       between keywords — percussive rhythm.
       ----------------------------------------------- */
    tl.set("#scene2-inner", { opacity: 1 }, 2.0);

    /* eyebrow fades in and holds */
    tl.fromTo("#kw-eyebrow",
      { opacity: 0, y: -12 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
      2.05
    );

    /* initial hidden state for keywords + their highlights */
    tl.set("#kw-analyse",     { x: -1200, opacity: 1 }, 2.0);
    tl.set("#kw-doc",         { x: -1200, opacity: 1 }, 2.0);
    tl.set("#kw-correction",  { x: -1200, opacity: 1 }, 2.0);
    tl.set("#kw-analyse .hl",    { scaleX: 0 }, 2.0);
    tl.set("#kw-doc .hl",        { scaleX: 0 }, 2.0);
    tl.set("#kw-correction .hl", { scaleX: 0 }, 2.0);

    /* --- KW 1: "Analyse." slam in at 2.35s --- */
    tl.fromTo("#kw-analyse",
      { x: -1200 },
      { x: 0, duration: 0.4, ease: "expo.out" },
      2.35
    );
    tl.fromTo("#kw-analyse .hl",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.3, ease: "power3.out" },
      2.4
    );
    /* exit right */
    tl.to("#kw-analyse", { x: 1200, duration: 0.3, ease: "power3.in", overwrite: "auto" }, 2.95);

    /* --- KW 2: "Génération de docs." slam in at 3.05s --- */
    tl.fromTo("#kw-doc",
      { x: -1200 },
      { x: 0, duration: 0.38, ease: "expo.out" },
      3.05
    );
    tl.fromTo("#kw-doc .hl",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.28, ease: "power3.out" },
      3.1
    );
    tl.to("#kw-doc", { x: 1200, duration: 0.28, ease: "power3.in", overwrite: "auto" }, 3.65);

    /* --- KW 3: "Correction." slam in at 3.72s --- */
    tl.fromTo("#kw-correction",
      { x: -1200 },
      { x: 0, duration: 0.36, ease: "expo.out" },
      3.72
    );
    tl.fromTo("#kw-correction .hl",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.26, ease: "power3.out" },
      3.77
    );
    tl.to("#kw-correction", { x: 1200, duration: 0.3, ease: "power3.in", overwrite: "auto" }, 4.2);

    /* eyebrow + scene fade out */
    tl.to("#kw-eyebrow", { opacity: 0, duration: 0.25, ease: "power1.in" }, 4.2);
    tl.set("#kw-eyebrow", { opacity: 0 }, 4.5);
    tl.to("#scene2-inner", { opacity: 0, duration: 0.2, ease: "power1.in" }, 4.3);
    tl.set("#scene2-inner", { opacity: 0 }, 4.5);

    /* -----------------------------------------------
       SCENE 3 — Signature mask-reveal
       ----------------------------------------------- */
    tl.set("#scene3-inner", { opacity: 1 }, 4.5);

    tl.fromTo("#sig-name",  { y: 60 }, { y: 0, duration: 0.42, ease: "power3.out" }, 4.65);
    tl.fromTo("#sig-title", { y: 38 }, { y: 0, duration: 0.38, ease: "power3.out" }, 5.0);

    tl.to("#scene3-inner", { opacity: 0, duration: 0.35, ease: "power1.in" }, 5.55);

    /* Hard kills */
    tl.set("#scene3-inner", { opacity: 0 }, 6.0);
    tl.set("#sig-name",  { y: 60 },      6.0);
    tl.set("#sig-title", { y: 38 },      6.0);

    window.__timelines["main"] = tl;
  </script>
</body>

</html>
